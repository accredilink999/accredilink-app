<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clearing cache...</title>
<style>
body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f1f5f9;color:#334155}
.box{text-align:center;padding:32px;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:360px;width:90%}
h2{color:#0d9488;margin:0 0 12px}
p{margin:8px 0;font-size:14px}
.spinner{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#0d9488;border-radius:50%;animation:spin 1s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
<h2>Clearing Cache</h2>
<div class="spinner"></div>
<p id="status">Removing old data...</p>
</div>
<script>
(async function(){
  var status = document.getElementById('status');
  try {
    // 1. Delete all caches
    if ('caches' in window) {
      var names = await caches.keys();
      await Promise.all(names.map(function(n){ return caches.delete(n); }));
      status.textContent = 'Caches cleared...';
    }
    // 2. Unregister all service workers
    if (navigator.serviceWorker) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r){ return r.unregister(); }));
      status.textContent = 'Service workers removed...';
    }
    // 3. Clear storage
    try { localStorage.clear(); } catch(e){}
    try { sessionStorage.clear(); } catch(e){}
    status.textContent = 'All clear! Redirecting...';
    // 4. Redirect to app
    setTimeout(function(){ window.location.replace('/'); }, 1000);
  } catch(e) {
    status.textContent = 'Error: ' + e.message + '. Try clearing manually.';
  }
})();
</script>
</body>
</html>
