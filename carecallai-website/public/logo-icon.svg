<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Clean rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle inner shadow -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="4"/>
  <!-- Shield shape (trust/compliance) -->
  <path d="M256 80c-60 0-120 30-140 50v120c0 90 60 150 140 180 80-30 140-90 140-180V130c-20-20-80-50-140-50z" fill="white" fill-opacity="0.12"/>
  <path d="M256 80c-60 0-120 30-140 50v120c0 90 60 150 140 180 80-30 140-90 140-180V130c-20-20-80-50-140-50z" fill="none" stroke="white" stroke-width="5" stroke-opacity="0.25"/>
  <!-- Heart rate / pulse line -->
  <path d="M100 260h80l20-40 30 80 30-80 20 40h112" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- CareCall text -->
  <text x="256" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" fill="white" letter-spacing="2">CareCall</text>
  <!-- AI badge -->
  <rect x="206" y="370" width="100" height="38" rx="10" fill="white" opacity="0.9"/>
  <text x="256" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="28" fill="#0d9488">AI</text>
</svg>
