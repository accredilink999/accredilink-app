name: Build Radio APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/build-radio-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://edaifkkkqwgavxkgozwi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_XLzc3szPjmX4ZmBz_wz4tA_-MJf-XBg
          VITE_APP_MODE: radio

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Write google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build radio debug APK
        run: |
          cd android
          ./gradlew assembleRadioDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Push error log on failure
        if: failure()
        run: |
          { grep -E "FAILED|Caused by:|error:|^e:|Execution failed" /tmp/gradle_output.txt; echo "===TAIL==="; tail -10 /tmp/gradle_output.txt; } > gradle_error.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add gradle_error.txt
          git commit -m "ci: gradle error log [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: carecall-radio-debug
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Publish to GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          gh release delete radio-latest --yes 2>/dev/null || true
          gh release create radio-latest "$APK" \
            --title "CareCall Radio APK (latest)" \
            --notes "Latest debug build — sideload onto the T320." \
            --latest

      - name: Upload Radio APK to Supabase storage
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          APK_SIZE=$(wc -c < "$APK")
          STORAGE_PATH="apk/carecallai-radio-latest.apk"
          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/uploads/${STORAGE_PATH}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          echo "Uploading Radio APK to Supabase storage..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary @"$APK" \
            "${SUPABASE_URL}/storage/v1/object/uploads/${STORAGE_PATH}")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ Upload successful: ${PUBLIC_URL}"
          else
            echo "✗ Upload failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

          SETTING_VALUE=$(jq -n \
            --arg url "$PUBLIC_URL" \
            --argjson size "$APK_SIZE" \
            --arg now "$NOW" \
            '{file_url: $url, filesize: $size, updated_at: $now}')

          ESCAPED=$(echo "$SETTING_VALUE" | jq -c '.')

          UPSERT_BODY=$(jq -n \
            --arg key "app_download_android_radio" \
            --argjson val "$SETTING_VALUE" \
            '{setting_key: $key, setting_value: $val, organization_id: null}')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            "${SUPABASE_URL}/rest/v1/system_settings" \
            -d "$UPSERT_BODY")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ system_settings upserted — download page will show new link"
          else
            echo "✗ system_settings upsert failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
